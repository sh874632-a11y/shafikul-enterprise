<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messars Shafikul Enterprise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7f6;color:#222}
header{background:#07875f;color:#fff;padding:18px 15px;text-align:center}
header h1{font-size:24px} header p{margin-top:5px}
nav{background:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
nav a{color:#07875f;text-decoration:none;font-weight:bold;margin:0 10px}
.hero{text-align:center;padding:42px 18px;background:#e8faf3}
.hero h2{font-size:30px;color:#075f45;margin-bottom:10px}
.hero p{font-size:17px;margin-bottom:20px}
.call{display:inline-block;background:#07875f;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:bold}
.products{max-width:1100px;margin:auto;padding:30px 15px}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title h2{color:#075f45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:180px;object-fit:cover;border-radius:9px;background:#eee}
.card h3{margin:10px 2px 5px;font-size:18px}
.price{color:#07875f;font-weight:bold;font-size:19px;margin:5px 2px 12px}
.order{display:block;text-align:center;background:#07875f;color:#fff;padding:10px;border-radius:7px;text-decoration:none;font-weight:bold}
.contact{text-align:center;background:#fff;padding:35px 15px;margin-top:10px}
footer{background:#075f45;color:#fff;text-align:center;padding:18px;margin-top:20px}
</style>
</head>
<body>

<header>
<h1>Messars Shafikul Enterprise</h1>
<p>আপনার বিশ্বস্ত মুদি পণ্যের দোকান</p>
</header>

<nav>
<a href="#home">হোম</a>
<a href="#products">পণ্য</a>
<a href="#contact">যোগাযোগ</a>
</nav>

<section class="hero" id="home">
<h2>প্রয়োজনীয় মুদি পণ্য এক জায়গায়</h2>
<p>পণ্য দেখুন এবং ফোনে সহজে অর্ডার করুন</p>
<a class="call" href="tel:01970895064">📞 01970895064</a>
</section>

<section class="products" id="products">
<div class="title">
<h2>🛒 আমাদের পণ্য</h2>
<span id="count"></span>
</div>
<div class="grid" id="productGrid"></div>
</section>

<section class="contact" id="contact">
<h2>📞 অর্ডার ও যোগাযোগ</h2>
<p style="margin:10px 0 15px">পণ্য অর্ডার করতে কল করুন</p>
<a class="call" href="tel:01970895064">01970895064</a>
</section>

<footer>© 2026 Messars Shafikul Enterprise</footer>

<script>
/*
=========================================================
নতুন পণ্য যোগ করার সবচেয়ে সহজ জায়গা
প্রতিটি পণ্যের জন্য একটি নতুন { ... } ব্লক কপি করে নিচে বসাও।

name = পণ্যের নাম
price = দাম
image = ছবির লিংক
=========================================================
*/

const products = [
  {
    name: "চাল",
    price: "৳ 0",
    image: "https://via.placeholder.com/600x400?text=Chal"
  },
  {
    name: "ডাল",
    price: "৳ 0",
    image: "https://via.placeholder.com/600x400?text=Dal"
  },
  {
    name: "সয়াবিন তেল",
    price: "৳ 0",
    image: "https://via.placeholder.com/600x400?text=Soybean+Oil"
  },
  {
    name: "চিনি",
    price: "৳ 0",
    image: "https://via.placeholder.com/600x400?text=Sugar"
  }
];

const grid = document.getElementById("productGrid");
document.getElementById("count").textContent = products.length + "টি পণ্য";

products.forEach(p => {
  grid.innerHTML += `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <h3>${p.name}</h3>
      <div class="price">${p.price}</div>
      <a class="order" href="tel:01970895064">📞 অর্ডার করুন</a>
    </div>
  `;
});
</script>

</body>
</html>
