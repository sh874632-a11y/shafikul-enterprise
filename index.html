<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার অনলাইন শপ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f6f7f9;color:#222}
header{background:#087f5b;color:white;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}
.logo{font-size:23px;font-weight:700}.cart{background:white;color:#087f5b;border:0;border-radius:20px;padding:9px 15px;font-weight:bold}
.hero{background:linear-gradient(135deg,#d8f5e9,#fff);padding:35px 5%;text-align:center}.hero h1{margin:0 0 10px;font-size:30px}.hero p{margin:0 0 20px;color:#555}
.search{width:min(600px,95%);padding:13px 16px;border:1px solid #ddd;border-radius:25px;font-size:16px}
.container{max-width:1100px;margin:25px auto;padding:0 15px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #00000012}.card img{width:100%;height:190px;object-fit:contain;background:#fff}.info{padding:13px}.info h3{margin:0 0 8px;font-size:17px}.price{font-size:19px;font-weight:bold;color:#087f5b}.buy{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#087f5b;color:white;font-weight:bold;cursor:pointer}
footer{margin-top:40px;background:#183b32;color:white;text-align:center;padding:25px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px}.box{background:white;max-width:500px;margin:5vh auto;padding:22px;border-radius:15px}.box h2{margin-top:0}.box input,.box textarea{width:100%;padding:11px;margin:7px 0;border:1px solid #ddd;border-radius:8px}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}.submit{width:100%;padding:12px;background:#087f5b;color:white;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<header>
  <div class="logo">🛍️ আমার অনলাইন শপ</div>
  <button class="cart" onclick="openCart()">🛒 কার্ট (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>আপনার পছন্দের পণ্য এক জায়গায়</h1>
  <p>সহজে পণ্য দেখুন এবং অর্ডার করুন</p>
  <input class="search" id="search" placeholder="পণ্য খুঁজুন..." oninput="render()">
</section>

<main class="container">
  <div class="title"><h2>আমাদের পণ্য</h2><span id="total"></span></div>
  <div class="grid" id="products"></div>
</main>

<footer>
  <b>আমার অনলাইন শপ</b><br><br>
  অর্ডারের জন্য ফোন/WhatsApp: 01XXXXXXXXX
</footer>

<div class="modal" id="modal">
 <div class="box">
  <button class="close" onclick="closeModal()">×</button>
  <h2>অর্ডার করুন</h2>
  <div id="selected"></div>
  <input id="name" placeholder="আপনার নাম">
  <input id="phone" placeholder="মোবাইল নম্বর">
  <textarea id="address" rows="3" placeholder="ডেলিভারি ঠিকানা"></textarea>
  <button class="submit" onclick="submitOrder()">অর্ডার পাঠান</button>
 </div>
</div>

<script>
const products=[
 {name:"Wheel Washing Powder 2kg",price:250,img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?auto=format&fit=crop&w=700&q=80"},
 {name:"আপনার পণ্য ২",price:350,img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=700&q=80"},
 {name:"আপনার পণ্য ৩",price:450,img:"https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=700&q=80"},
 {name:"আপনার পণ্য ৪",price:550,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80"}
];
let cart=[];
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>p.name.toLowerCase().includes(q));
 document.getElementById("total").textContent=list.length+"টি পণ্য";
 document.getElementById("products").innerHTML=list.map((p,i)=>`
 <div class="card"><img src="${p.img}" alt="${p.name}">
 <div class="info"><h3>${p.name}</h3><div class="price">৳ ${p.price}</div>
 <button class="buy" onclick="add(${products.indexOf(p)})">অর্ডার করুন</button></div></div>`).join("");
}
function add(i){cart.push(products[i]);document.getElementById("count").textContent=cart.length;openOrder(products[i]);}
function openOrder(p){document.getElementById("selected").innerHTML="<b>"+p.name+"</b> — ৳ "+p.price;document.getElementById("modal").style.display="block";}
function closeModal(){document.getElementById("modal").style.display="none"}
function openCart(){alert(cart.length?("কার্টে "+cart.length+"টি পণ্য আছে।"): "কার্ট খালি আছে।")}
function submitOrder(){
 const n=document.getElementById("name").value.trim(),ph=document.getElementById("phone").value.trim(),a=document.getElementById("address").value.trim();
 if(!n||!ph||!a){alert("নাম, মোবাইল নম্বর ও ঠিকানা দিন।");return;}
 alert("ধন্যবাদ "+n+"! আপনার অর্ডারটি গ্রহণের জন্য প্রস্তুত।\nমোবাইল: "+ph);
 closeModal();
}
render();
</script>
</body>
</html>
