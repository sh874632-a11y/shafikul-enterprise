<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আমার অনলাইন শপ</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center}
.container{max-width:900px;margin:auto;padding:15px}
.box{background:#fff;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 2px 10px #ddd}
input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#111;color:white;border:0;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.product{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #ddd}
.product img{width:100%;height:160px;object-fit:cover;border-radius:8px;background:#eee}
.price{font-weight:bold;font-size:18px;margin:8px 0}
.delete{background:#c62828}
#preview{max-width:150px;max-height:150px;display:none;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<header><h1>🛍️ আমার অনলাইন শপ</h1><p>আমাদের পণ্য</p></header>

<div class="container">
<div class="box">
<h2>➕ নতুন পণ্য যোগ করুন</h2>
<input id="name" placeholder="পণ্যের নাম">
<input id="price" type="number" placeholder="দাম (৳)">
<input id="details" placeholder="পণ্যের বিস্তারিত (যেমন: 2kg, ব্যবহার ইত্যাদি)">
<input id="image" type="file" accept="image/*">
<img id="preview">
<button onclick="addProduct()">পণ্য যোগ করুন</button>
</div>

<div class="box">
<h2>🛒 পণ্যসমূহ</h2>
<div id="products" class="products"></div>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("myProducts") || "[]");

document.getElementById("image").addEventListener("change",function(){
 const file=this.files[0];
 if(file){
   const r=new FileReader();
   r.onload=e=>{
     document.getElementById("preview").src=e.target.result;
     document.getElementById("preview").style.display="block";
   };
   r.readAsDataURL(file);
 }
});

function addProduct(){
 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();
 const file=document.getElementById("image").files[0];

 if(!name || !price || !file){
   alert("পণ্যের নাম, দাম ও ছবি দিন।");
   return;
 }

 const reader=new FileReader();
 reader.onload=function(e){
   const details=document.getElementById("details").value.trim();
   products.push({name:name,price:price,details:details,image:e.target.result});
   localStorage.setItem("myProducts",JSON.stringify(products));
   document.getElementById("name").value="";
   document.getElementById("price").value="";
   document.getElementById("details").value="";
   document.getElementById("image").value="";
   document.getElementById("preview").style.display="none";
   showProducts();
   alert("পণ্য যোগ হয়েছে!");
 };
 reader.readAsDataURL(file);
}

function showDetails(i){ const el=document.getElementById("details-"+i); el.style.display=el.style.display==="none"?"block":"none"; }

function removeProduct(i){
 products.splice(i,1);
 localStorage.setItem("myProducts",JSON.stringify(products));
 showProducts();
}

function showProducts(){
 const box=document.getElementById("products");
 if(!products.length){
   box.innerHTML="<p>এখনো কোনো নতুন পণ্য যোগ করা হয়নি।</p>";
   return;
 }
 box.innerHTML=products.map((p,i)=>`
 <div class="product">
   <img src="${p.image}">
   <h3>${escapeHtml(p.name)}</h3>
   <div class="price">৳${escapeHtml(p.price)}</div>
   <button onclick="showDetails(${i})">বিস্তারিত দেখুন</button>
   <div id="details-${i}" style="display:none;padding:8px;background:#f5f5f5;border-radius:8px;margin:6px 0">${escapeHtml(p.details || "কোনো বিস্তারিত দেওয়া হয়নি।")}</div>
   <button class="delete" onclick="removeProduct(${i})">মুছে ফেলুন</button>
 </div>`).join("");
}
function escapeHtml(s){
 return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
showProducts();
</script>
</body>
</html>
